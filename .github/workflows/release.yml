name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: rustytube-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: rustytube-linux-x86_64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: rustytube-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.platform.target }}/release/rustytube

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: mv target/${{ matrix.platform.target }}/release/rustytube ${{ matrix.platform.name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.platform.target }}/release/rustytube.exe ${{ matrix.platform.name }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create checksums
        run: |
          for file in rustytube-*/rustytube-*; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: RustyTube ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            rustytube-linux-x86_64/rustytube-linux-x86_64
            rustytube-linux-x86_64/rustytube-linux-x86_64.sha256
            rustytube-linux-x86_64-musl/rustytube-linux-x86_64-musl
            rustytube-linux-x86_64-musl/rustytube-linux-x86_64-musl.sha256
            rustytube-windows-x86_64.exe/rustytube-windows-x86_64.exe
            rustytube-windows-x86_64.exe/rustytube-windows-x86_64.exe.sha256
