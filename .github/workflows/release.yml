name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: rustytube-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: rustytube-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: rustytube-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: rustytube-linux-aarch64-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          if [[ "${{ matrix.platform.target }}" == *"musl"* ]]; then
            sudo apt-get install -y musl-tools
          fi
          if [[ "${{ matrix.platform.target }}" == "aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure ARM linker
        if: startsWith(matrix.platform.target, 'aarch64')
        run: |
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Strip binary (x86_64)
        if: startsWith(matrix.platform.target, 'x86_64')
        run: strip target/${{ matrix.platform.target }}/release/rustytube

      - name: Strip binary (ARM64)
        if: startsWith(matrix.platform.target, 'aarch64')
        run: aarch64-linux-gnu-strip target/${{ matrix.platform.target }}/release/rustytube

      - name: Rename binary
        run: mv target/${{ matrix.platform.target }}/release/rustytube ${{ matrix.platform.name }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create checksums
        run: |
          for file in rustytube-*/rustytube-*; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: RustyTube ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            rustytube-linux-x86_64/rustytube-linux-x86_64
            rustytube-linux-x86_64/rustytube-linux-x86_64.sha256
            rustytube-linux-x86_64-musl/rustytube-linux-x86_64-musl
            rustytube-linux-x86_64-musl/rustytube-linux-x86_64-musl.sha256
            rustytube-linux-aarch64/rustytube-linux-aarch64
            rustytube-linux-aarch64/rustytube-linux-aarch64.sha256
            rustytube-linux-aarch64-musl/rustytube-linux-aarch64-musl
            rustytube-linux-aarch64-musl/rustytube-linux-aarch64-musl.sha256
